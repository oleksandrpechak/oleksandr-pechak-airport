components:
  schemas:
    Airline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        founded_year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
      required:
      - id
      - name
    Airplane:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 100
        rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        seats_per_row:
          type: integer
          maximum: 2147483647
          minimum: 0
        business_rows_percent:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - brand
      - id
      - model
      - rows
      - seats_per_row
    AirplaneSeat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        airplane:
          type: integer
        row:
          type: integer
          maximum: 2147483647
          minimum: 0
        seat:
          type: string
          maxLength: 10
        class_type:
          $ref: '#/components/schemas/ClassTypeEnum'
      required:
      - airplane
      - id
      - row
      - seat
    Airport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        iata_code:
          type: string
          maxLength: 3
        city:
          type: integer
        city_name:
          type: string
          readOnly: true
        country_code:
          type: string
          readOnly: true
        airline:
          type: array
          items:
            type: integer
      required:
      - airline
      - city
      - city_name
      - country_code
      - iata_code
      - id
      - name
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/BookingTicket'
          readOnly: true
        payment:
          allOf:
          - $ref: '#/components/schemas/BookingPayment'
          nullable: true
          readOnly: true
      required:
      - created_at
      - expires_at
      - id
      - payment
      - status
      - tickets
      - total_price
      - user
    BookingPayment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
    BookingStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - pending
        * `CONFIRMED` - confirmed
        * `CANCELLED` - cancelled
    BookingTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        flight_id:
          type: integer
        flight_number:
          type: string
        departure_iata:
          type: string
        arrival_iata:
          type: string
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        row:
          type: integer
        seat:
          type: string
        class_type:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        ticket_status:
          $ref: '#/components/schemas/TicketStatusEnum'
      required:
      - arrival_iata
      - arrival_time
      - class_type
      - departure_iata
      - departure_time
      - flight_id
      - flight_number
      - id
      - price
      - row
      - seat
    ChatMessageRequest:
      type: object
      properties:
        content:
          type: string
      required:
      - content
    ChatMessageResponse:
      type: object
      properties:
        response:
          type: string
      required:
      - response
    CheckoutSession:
      type: object
      properties:
        chekout_url:
          type: string
          format: uri
      required:
      - chekout_url
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        city:
          type: string
          maxLength: 150
        country:
          type: integer
      required:
      - city
      - country
      - id
    ClassTypeEnum:
      enum:
      - BUSINESS
      - ECONOMY
      type: string
      description: |-
        * `BUSINESS` - business
        * `ECONOMY` - economy
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_activity_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_activity_at
    Country:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        country:
          type: string
          maxLength: 100
        code:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
      required:
      - code
      - country
      - id
    CustomUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - password
      - role
    FleetItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tail_number:
          type: string
          maxLength: 8
        airplane:
          type: integer
        airline:
          type: integer
      required:
      - airline
      - airplane
      - id
      - tail_number
    Flight:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        flight_number:
          type: string
          maxLength: 5
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        ticket_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        business_percent:
          type: integer
          maximum: 2147483647
          minimum: 0
        flight_status:
          allOf:
          - $ref: '#/components/schemas/FlightStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        departure_airport:
          type: integer
        arrival_airport:
          type: integer
        airplane:
          type: integer
        airline_name:
          type: integer
      required:
      - airline_name
      - airplane
      - arrival_airport
      - arrival_time
      - business_percent
      - created_at
      - departure_airport
      - departure_time
      - flight_number
      - flight_status
      - id
      - ticket_price
    FlightAirline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
      required:
      - id
      - name
    FlightAirplane:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tail_number:
          type: string
          maxLength: 8
        brand:
          type: string
        model:
          type: string
      required:
      - brand
      - id
      - model
      - tail_number
    FlightAirport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        iata_code:
          type: string
          maxLength: 3
        city:
          type: string
        country_code:
          type: string
      required:
      - city
      - country_code
      - iata_code
      - id
      - name
    FlightRead:
      type: object
      description: |-
        Flight as shown to passengers and in lists: related objects nested,
        business price computed, available_seats annotated by the viewset.
      properties:
        id:
          type: integer
          readOnly: true
        flight_number:
          type: string
          maxLength: 5
        departure_airport:
          $ref: '#/components/schemas/FlightAirport'
        arrival_airport:
          $ref: '#/components/schemas/FlightAirport'
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        ticket_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        business_price:
          type: number
          format: double
          readOnly: true
        business_percent:
          type: integer
          maximum: 2147483647
          minimum: 0
        airline_name:
          $ref: '#/components/schemas/FlightAirline'
        airplane:
          $ref: '#/components/schemas/FlightAirplane'
        flight_status:
          $ref: '#/components/schemas/FlightStatusEnum'
        available_seats:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - airline_name
      - airplane
      - arrival_airport
      - arrival_time
      - available_seats
      - business_percent
      - business_price
      - created_at
      - departure_airport
      - departure_time
      - flight_number
      - id
      - ticket_price
    FlightStatusEnum:
      enum:
      - SCHEDULED
      - BOARDING
      - DEPARTED
      - DELAYED
      - CANCELLED
      type: string
      description: |-
        * `SCHEDULED` - scheduled
