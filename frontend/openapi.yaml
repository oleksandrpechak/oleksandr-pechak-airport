          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/SeatMap'
    PaginatedTicketList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
    PatchedAirline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        founded_year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
    PatchedAirplane:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 100
        rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        seats_per_row:
          type: integer
          maximum: 2147483647
          minimum: 0
        business_rows_percent:
          type: integer
          maximum: 2147483647
          minimum: 0
    PatchedAirplaneSeat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        airplane:
          type: integer
        row:
          type: integer
          maximum: 2147483647
          minimum: 0
        seat:
          type: string
          maxLength: 10
        class_type:
          $ref: '#/components/schemas/ClassTypeEnum'
    PatchedAirport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        iata_code:
          type: string
          maxLength: 3
        city:
          type: integer
        city_name:
          type: string
          readOnly: true
        country_code:
          type: string
          readOnly: true
        airline:
          type: array
          items:
            type: integer
    PatchedCity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        city:
          type: string
          maxLength: 150
        country:
          type: integer
    PatchedCountry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        country:
          type: string
          maxLength: 100
        code:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
    PatchedCustomUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
    PatchedFleetItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tail_number:
          type: string
          maxLength: 8
        airplane:
          type: integer
        airline:
          type: integer
    PatchedFlight:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        flight_number:
          type: string
          maxLength: 5
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        ticket_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        business_percent:
          type: integer
          maximum: 2147483647
          minimum: 0
        flight_status:
          allOf:
          - $ref: '#/components/schemas/FlightStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        departure_airport:
          type: integer
        arrival_airport:
          type: integer
        airplane:
          type: integer
        airline_name:
          type: integer
    PatchedTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        flight_number:
          type: integer
        booking:
          type: integer
          nullable: true
        passenger_name:
          type: integer
          nullable: true
        flight_seat:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        ticket_status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
    Payment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        stripe_session_id:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        booking:
          type: integer
      required:
      - amount
      - booking
      - created_at
      - id
      - stripe_session_id
    PaymentStatusEnum:
      enum:
      - PENDING
      - COMPLETED
      - FAILED
      - EXPIRED
      type: string
      description: |-
        * `PENDING` - pending
        * `COMPLETED` - completed
        * `FAILED` - fail
        * `EXPIRED` - expired
    PaymentSuccess:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    RoleEnum:
      enum:
      - ADMIN
      - USER
      type: string
      description: |-
        * `ADMIN` - Admin
        * `USER` - User
    SeatMap:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        flight_seat:
          type: integer
        row:
          type: integer
        seat:
          type: string
        class_type:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        ticket_status:
          $ref: '#/components/schemas/TicketStatusEnum'
      required:
      - class_type
      - flight_seat
      - id
      - price
      - row
      - seat
    Ticket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        flight_number:
          type: integer
        booking:
          type: integer
          nullable: true
        passenger_name:
          type: integer
          nullable: true
        flight_seat:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        ticket_status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
      required:
      - flight_number
      - flight_seat
      - id
      - price
      - ticket_status
    TicketStatusEnum:
      enum:
      - AVAILABLE
      - BOOKED
      - USED
      - PAID
      - CANCELLED
      type: string
      description: |-
        * `AVAILABLE` - available
        * `BOOKED` - booked
        * `USED` - used
        * `PAID` - paid
        * `CANCELLED` - cancelled
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
